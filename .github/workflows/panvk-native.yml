name: Build PanVK for Termux (aarch64, native)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Native ARM64 runner — no QEMU, matches the dev's native Termux build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── NEW: generate date + time (UTC) for release naming ──
      - name: Compute build timestamp
        id: ts
        run: |
          DATE=$(date -u +'%Y-%m-%d')
          TIME=$(date -u +'%H%M%S')
          STAMP="${DATE}-${TIME}"
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "date=$DATE"           >> "$GITHUB_OUTPUT"
          echo "time=$TIME"           >> "$GITHUB_OUTPUT"
          echo "stamp=$STAMP"         >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "Build stamp: $STAMP (${SHORT_SHA})"

      - name: Build PanVK inside native Termux container
        run: |
          set -euo pipefail

          mkdir -p "${{ github.workspace }}/termux-out"
          # Grant global write permissions so the Docker container user can write to it
          chmod 777 "${{ github.workspace }}/termux-out"

          # Host is real aarch64 -> no --platform / --privileged / QEMU needed
          docker run --rm \
            -v "${{ github.workspace }}/termux-out:/termux-out" \
            termux/termux-docker:aarch64 \
            bash -c '
              set -euo pipefail
              export TMPDIR="${TMPDIR:-$PREFIX/tmp}"

              pkg update -y

              # Exact dependency list from the dev'"'"'s working recipe
              pkg install -y \
                git clang lld  ninja python python-pip pkg-config \
                bison flex cmake glslang shaderc vulkan-headers \
                vulkan-loader-generic libandroid-shmem libdrm libxcb \
                xorgproto libx11 libxshmfence zlib zstd libexpat libclc spirv-llvm-translator \
                libxrandr libxrandr-static

              pip install --break-system-packages meson mako pyyaml packaging

              mkdir -p "$TMPDIR"
              cd "$TMPDIR"
              rm -rf mesa-panvk
              git clone --depth 1 https://github.com/xodiosx/mesa-panvk-g57.git mesa-panvk
              cd mesa-panvk

              # Exact dev recipe (BUILDING.md + native Termux flags)
              meson setup build-bionic \
                -Dbuildtype=debugoptimized \
                -Dvulkan-drivers=panfrost \
                -Dgallium-drivers= \
                -Dpanfrost-kmds=kbase,panthor \
                -Dplatforms=x11 \
                -Dglx=disabled \
                -Degl=disabled \
                -Dopengl=false \
                -Dgles1=disabled \
                -Dgles2=disabled \
                -Dbuild-tests=false \
                -Dlibunwind=disabled \
                -Dvalgrind=disabled \
                -Dperfetto=false \
                -Dpanvk-use-kbase=true \
                -Dprefix="$PREFIX" \
                -Dc_link_args=-landroid-shmem \
                -Dcpp_link_args=-landroid-shmem

              # Build ONLY the PanVK shared library — this is the biggest speedup
              ninja -C build-bionic -j$(nproc) \
                src/panfrost/vulkan/libvulkan_panfrost.so

              mkdir -p /termux-out/lib
              mkdir -p /termux-out/share/vulkan/icd.d
              find build-bionic -name "libvulkan_panfrost*.so" -exec cp {} /termux-out/lib/ \;
              find build-bionic -name "panfrost_icd*.json" -exec cp {} /termux-out/share/vulkan/icd.d/ \;

              echo "=== /termux-out ==="
              find /termux-out -type f
            '

      # ── NEW: package the output into a timestamped tarball ──
      - name: Package artifact tarball
        run: |
          set -euo pipefail
          cd termux-out
          TARBALL="panvk-termux-aarch64-${{ steps.ts.outputs.stamp }}.tar.gz"
          tar -czvf "../${TARBALL}" .
          cd ..
          ls -lh "${TARBALL}"
          echo "TARBALL=${TARBALL}" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: panvk-termux-aarch64-${{ steps.ts.outputs.stamp }}
          path: |
            termux-out/
            ${{ env.TARBALL }}

      # ── UPDATED: release name now includes date + time ──
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "${{ github.ref_name }} — PanVK build ${{ steps.ts.outputs.date }} ${{ steps.ts.outputs.time }} UTC"
          body: |
            ## PanVK for Termux (aarch64, native build)

            **Build date (UTC):** `${{ steps.ts.outputs.date }}`
            **Build time (UTC):** `${{ steps.ts.outputs.time }}`
            **Commit:** `${{ github.sha }}` (`${{ steps.ts.outputs.short_sha }}`)
            **Ref:** `${{ github.ref_name }}`

            ### Files
            - `${{ env.TARBALL }}` — full install tree (extract into `$PREFIX`)
            - `libvulkan_panfrost*.so` — Vulkan driver
            - `panfrost_icd*.json` — ICD manifest

            ### Install (Termux)
            ```bash
            tar -xzf ${{ env.TARBALL }} -C $PREFIX
            export VK_ICD_FILENAMES=$PREFIX/share/vulkan/icd.d/panfrost_icd.aarch64.json
            ```
          files: |
            ${{ env.TARBALL }}
            termux-out/lib/libvulkan_panfrost*.so
            termux-out/share/vulkan/icd.d/*.json
          generate_release_notes: true
          prerelease: true
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
