name: Build PanVK for Termux (aarch64, native)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag to create (leave empty to auto-generate from date/time)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Compute date + time + a safe tag name ──
      - name: Compute build timestamp and tag
        id: ts
        run: |
          DATE=$(date -u +'%Y-%m-%d')
          TIME=$(date -u +'%H%M%S')
          STAMP="${DATE}-${TIME}"
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "date=$DATE"           >> "$GITHUB_OUTPUT"
          echo "time=$TIME"           >> "$GITHUB_OUTPUT"
          echo "stamp=$STAMP"         >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"

          # Decide the tag name:
          #  - if triggered by a v* tag push  -> use that tag
          #  - else (manual dispatch)         -> use input, or auto-generate
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
          elif [[ -n "${{ github.event.inputs.release_tag }}" ]]; then
            TAG="${{ github.event.inputs.release_tag }}"
          else
            TAG="build-${DATE}-${TIME}-${SHORT_SHA}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved tag: $TAG"

      - name: Pull Termux container image (with retry)
        run: |
          set -euo pipefail
          for i in 1 2 3; do
            if docker pull termux/termux-docker:aarch64; then
              docker images termux/termux-docker:aarch64
              break
            fi
            echo "docker pull attempt $i failed, retrying in 15s..."
            sleep 15
            if [[ $i -eq 3 ]]; then
              echo "docker pull failed after 3 attempts" >&2
              docker info || true
              exit 1
            fi
          done

      - name: Build PanVK inside native Termux container
        run: |
          set -euo pipefail

          mkdir -p "${{ github.workspace }}/termux-out"
          chmod 777 "${{ github.workspace }}/termux-out"

          docker run --rm \
            -v "${{ github.workspace }}:/src:ro" \
            -v "${{ github.workspace }}/termux-out:/termux-out" \
            termux/termux-docker:aarch64 \
            bash -c '
              set -euo pipefail
              export TMPDIR="${TMPDIR:-$PREFIX/tmp}"

              for i in 1 2 3; do
                if pkg update; then
                  break
                fi
                echo "pkg update attempt $i failed, retrying in 10s..."
                sleep 10
                if [[ $i -eq 3 ]]; then
                  echo "pkg update failed after 3 attempts" >&2
                  exit 1
                fi
              done

              # Heal the stale base image: installed packages predate the
              # mirror metadata (e.g. ncurses vs ncurses-ui-libs skew),
              # which makes pkg install fail with "held broken packages".
              pkg upgrade -y

              pkg install -y \
                git clang lld  ninja python python-pip pkg-config \
                bison flex cmake glslang shaderc vulkan-headers \
                vulkan-loader-generic libandroid-shmem libdrm libxcb \
                xorgproto libx11 libxshmfence zlib zstd libexpat libclc spirv-llvm-translator \
                libxrandr libxrandr-static

              pip install --break-system-packages meson mako pyyaml packaging

              mkdir -p "$TMPDIR"
              cd "$TMPDIR"
              rm -rf mesa-panvk
              # Build THIS repo (frag-extres + debug-gate fix), not upstream.
              cp -a /src mesa-panvk
              cd mesa-panvk
              rm -rf build-bionic termux-out

              meson setup build-bionic \
                -Dbuildtype=debugoptimized \
                -Dvulkan-drivers=panfrost \
                -Dgallium-drivers= \
                -Dpanfrost-kmds=kbase,panthor \
                -Dplatforms=x11 \
                -Dglx=disabled \
                -Degl=disabled \
                -Dopengl=false \
                -Dgles1=disabled \
                -Dgles2=disabled \
                -Dbuild-tests=false \
                -Dlibunwind=disabled \
                -Dvalgrind=disabled \
                -Dperfetto=false \
                -Dpanvk-use-kbase=true \
                -Dprefix="$PREFIX" \
                -Dc_link_args=-landroid-shmem \
                -Dcpp_link_args=-landroid-shmem

              ninja -C build-bionic -j$(nproc) \
                src/panfrost/vulkan/libvulkan_panfrost.so

              mkdir -p /termux-out/lib
              mkdir -p /termux-out/share/vulkan/icd.d
              find build-bionic -name "libvulkan_panfrost*.so" -exec cp {} /termux-out/lib/ \;
              find build-bionic -name "panfrost_icd*.json" -exec cp {} /termux-out/share/vulkan/icd.d/ \;

              echo "=== /termux-out ==="
              find /termux-out -type f
            '

      - name: Package artifact tarball
        run: |
          set -euo pipefail
          cd termux-out
          TARBALL="panvk-termux-aarch64-${{ steps.ts.outputs.stamp }}.tar.gz"
          tar -czvf "../${TARBALL}" .
          cd ..
          ls -lh "${TARBALL}"
          echo "TARBALL=${TARBALL}" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: panvk-termux-aarch64-${{ steps.ts.outputs.stamp }}
          path: |
            termux-out/
            ${{ env.TARBALL }}

      # ── ALWAYS create a release (tag push OR manual dispatch) ──
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ts.outputs.tag }}
          name: "${{ steps.ts.outputs.tag }} — PanVK build ${{ steps.ts.outputs.date }} ${{ steps.ts.outputs.time }} UTC"
          body: |
            ## PanVK for Termux (aarch64, native build)

            **Build date (UTC):** `${{ steps.ts.outputs.date }}`
            **Build time (UTC):** `${{ steps.ts.outputs.time }}`
            **Commit:** `${{ github.sha }}` (`${{ steps.ts.outputs.short_sha }}`)
            **Triggered by:** `${{ github.event_name }}`

            ### Files
            - `${{ env.TARBALL }}` — full install tree (extract into `$PREFIX`)
            - `libvulkan_panfrost*.so` — Vulkan driver
            - `panfrost_icd*.json` — ICD manifest

            ### Install (Termux)
            ```bash
            tar -xzf ${{ env.TARBALL }} -C $PREFIX
            export VK_ICD_FILENAMES=$PREFIX/share/vulkan/icd.d/panfrost_icd.aarch64.json
            ```
          files: |
            ${{ env.TARBALL }}
            termux-out/lib/libvulkan_panfrost*.so
            termux-out/share/vulkan/icd.d/*.json
          generate_release_notes: true
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
