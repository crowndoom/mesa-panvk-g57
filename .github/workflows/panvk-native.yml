name: Build PanVK for Termux (aarch64)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build PanVK inside Termux container
        run: |
          set -euo pipefail

          mkdir -p "${{ github.workspace }}/termux-out"

          docker run --rm \
            --privileged \
            --platform linux/arm64 \
            -v "${{ github.workspace }}/termux-out:/termux-out" \
            termux/termux-docker:aarch64 \
            bash -c '
              set -euo pipefail

              # Termux does not export TMPDIR in non-interactive shells.
              export TMPDIR="${TMPDIR:-$PREFIX/tmp}"

              pkg update -y

              # Install dependencies
              pkg install -y \
                git ninja clang llvm \
                bison flex \
                glslang libclc spirv-tools \
                libandroid-shmem libdrm libelf libexpat \
                libx11 libxext libxfixes libxrandr \
                libxshmfence libxxf86vm vulkan-loader \
                zlib zstd pkg-config python python-pip cmake spirv-llvm-translator

              # Bypass PEP 668 for ephemeral container
              pip install --break-system-packages meson mako pyyaml packaging ply

              mkdir -p "$TMPDIR"
              cd "$TMPDIR"
              git clone --depth 1 https://github.com/xodiosx/mesa-panvk-g57.git mesa-panvk
              cd mesa-panvk

              meson setup build-bionic \
                -Dplatforms=x11 \
                -Dvulkan-drivers=panfrost \
                -Dgallium-drivers= \
                -Dpanfrost-kmds=kbase \
                -Dpanfrost-rust=false \
                -Dllvm=enabled \
                -Dc_link_args="-landroid-shmem" \
                -Dcpp_link_args="-landroid-shmem" \
                -Dbuildtype=release

              ninja -C build-bionic -j2

              mkdir -p /termux-out/lib
              mkdir -p /termux-out/share/vulkan/icd.d

              find build-bionic -name "libvulkan_panfrost*.so" -exec cp {} /termux-out/lib/ \;
              find build-bionic -name "panfrost_icd*.json" -exec cp {} /termux-out/share/vulkan/icd.d/ \;

              echo "=== Contents of /termux-out ==="
              find /termux-out -type f
            '

      - name: Upload PanVK artefacts
        uses: actions/upload-artifact@v4
        with:
          name: panvk-termux-aarch64
          path: termux-out/

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            termux-out/lib/libvulkan_panfrost*.so
            termux-out/share/vulkan/icd.d/*.json
          generate_release_notes: true
          prerelease: true
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
