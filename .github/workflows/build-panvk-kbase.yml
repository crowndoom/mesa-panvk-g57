name: Build panvk kbase

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            bison flex pkg-config \
            libx11-dev libxext-dev libxrandr-dev libxfixes-dev libxdamage-dev \
            libxshmfence-dev libdrm-dev libwayland-dev libwayland-egl-backend-dev \
            wayland-protocols \
            libvulkan-dev zlib1g-dev libexpat1-dev libunwind-dev libzstd-dev \
            libelf-dev libclang-dev llvm-dev clang \
            libllvmspirvlib-18-dev libclc-18-dev spirv-tools \
            libxcb-randr0-dev libxcb-glx0-dev libxcb-shm0-dev \
            libxcb-xfixes0-dev libxcb-dri3-dev libxcb-present-dev \
            libx11-xcb-dev libxcb-keysyms1-dev libxxf86vm-dev

      - name: Install Meson
        run: |
          python3 -m pip install --break-system-packages \
            'meson>=1.4.0,<2' mako PyYAML packaging

      - name: Configure Mesa
        run: |
          set -o pipefail
          meson setup build-panvk \
            -Dpanvk-use-kbase=true \
            -Dpanfrost-kmds=kbase,panthor \
            -Dvulkan-drivers=panfrost \
            -Dgallium-drivers=panfrost \
            -Dllvm=enabled \
            -Dcpp_std=c++17 2>&1 | tee configure.log

      - name: Build Mesa
        run: |
          cd build-panvk
          set -o pipefail
          rc=0
          ninja 2>&1 | tee ../build.log || rc=$?
          if [ "$rc" -ne 0 ]; then
            # Emit immediately: the failure reporter below cannot always
            # see build.log, and job logs need admin rights to read.
            echo "::error title=build failed::ninja exited with ${rc}"
            grep -E "error:|Error |FAILED|undefined reference|No such file" ../build.log \
              2>/dev/null | sort -u | head -25 | while IFS= read -r line; do
                echo "::error::$(printf '%s' "$line" | sed 's/%/%25/g')"
              done
            echo "::error title=tail of build.log::"
            tail -25 ../build.log 2>/dev/null | while IFS= read -r line; do
              echo "::error::$(printf '%s' "$line" | sed 's/%/%25/g')"
            done
          fi
          exit "$rc"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mesa-panvk-kbase
          path: build-panvk/
          retention-days: 7

      # Must run last: job logs require admin rights to fetch via the API,
      # so annotations are the only publicly readable diagnostics. Placed
      # after every build step so it fires for configure *and* build failures.
      - name: Report errors
        if: failure()
        run: |
          n=0
          for f in configure.log build.log build-panvk/meson-logs/meson-log.txt; do
            [ -f "$f" ] || continue
            grep -E "ERROR|error:|FAILED|undefined reference|No such file|Traceback" "$f" 2>/dev/null | tail -10
            echo "---- tail of $f ----"
            tail -10 "$f"
          done | while IFS= read -r line; do
            n=$((n+1))
            [ "$n" -gt 30 ] && break
            echo "::error::$(printf '%s' "$line" | sed 's/%/%25/g')"
          done
