name: release Panfrost (OpenGL) for Termux (aarch64, native)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build type"
        type: choice
        required: true
        default: both
        options:
          - both
          - debugoptimized
          - release
      release_tag:
        description: "Tag to create (leave empty to auto-generate)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      date:  ${{ steps.ts.outputs.date }}
      time:  ${{ steps.ts.outputs.time }}
      stamp: ${{ steps.ts.outputs.stamp }}
      tag:   ${{ steps.ts.outputs.tag }}
      types: ${{ steps.ts.outputs.types }}
    steps:
      - name: Compute build timestamp and tag
        id: ts
        run: |
          DATE=$(date -u +'%Y-%m-%d')
          TIME=$(date -u +'%H%M%S')
          STAMP="${DATE}-${TIME}"
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "date=$DATE"           >> "$GITHUB_OUTPUT"
          echo "time=$TIME"           >> "$GITHUB_OUTPUT"
          echo "stamp=$STAMP"         >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
          elif [[ -n "${{ github.event.inputs.release_tag }}" ]]; then
            TAG="${{ github.event.inputs.release_tag }}"
          else
            TAG="build-${DATE}-${TIME}-${SHORT_SHA}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          CHOICE="${{ github.event.inputs.build_type }}"
          case "$CHOICE" in
            release)        TYPES='["release"]' ;;
            debugoptimized) TYPES='["debugoptimized"]' ;;
            *)              TYPES='["debugoptimized","release"]' ;;
          esac
          echo "types=$TYPES" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        build-type: ${{ fromJSON(needs.prepare.outputs.types) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify sigbus.patch exists at repo root
        run: |
          set -euo pipefail
          PATCH="${{ github.workspace }}/sigbus.patch"
          if [[ ! -f "$PATCH" ]]; then
            echo "ERROR: sigbus.patch not found at repo root ($PATCH)"
            ls -la "${{ github.workspace }}"
            exit 1
          fi
          echo "Found patch:"
          ls -lh "$PATCH"
          echo "--- first 30 lines ---"
          head -n 30 "$PATCH"

      - name: Create silence header on runner
        run: |
          set -euo pipefail
          HDR="${{ github.workspace }}/panvk_silence.h"
          cat > "$HDR" <<'EOF'
          #pragma once
          #include <stdio.h>
          #include <string.h>
          #include <stdarg.h>

          static inline int __panvk_silence_fprintf(FILE *fp, const char *fmt, ...) {
              if (fp == stderr && fmt && strncmp(fmt, "PANVKDBG", 8) == 0)
                  return 0;
              va_list ap;
              va_start(ap, fmt);
              int r = vfprintf(fp, fmt, ap);
              va_end(ap);
              return r;
          }

          #define fprintf(fp, ...) __panvk_silence_fprintf((fp), __VA_ARGS__)
          EOF
          echo "--- wrote $HDR ---"
          wc -l "$HDR"
          echo "--- contents ---"
          cat "$HDR"

      - name: Build Panfrost (${{ matrix.build-type }}) inside Termux container
        run: |
          set -euo pipefail

          mkdir -p "${{ github.workspace }}/termux-out-${{ matrix.build-type }}"
          chmod 777 "${{ github.workspace }}/termux-out-${{ matrix.build-type }}"

          docker run --rm \
            -v "${{ github.workspace }}/termux-out-${{ matrix.build-type }}:/termux-out" \
            -v "${{ github.workspace }}:/patch:ro" \
            termux/termux-docker:aarch64 \
            bash -c '
              set -euo pipefail
              export TMPDIR="${TMPDIR:-$PREFIX/tmp}"
              export BUILD_TYPE="'"${{ matrix.build-type }}"'"

              # Swap Aliyun for the official Termux mirror (Aliyun is often mid-sync)
              mkdir -p "$PREFIX/etc/apt/sources.list.d"
              echo "deb https://packages.termux.dev/apt/termux-main stable main" \
                > "$PREFIX/etc/apt/sources.list.d/termux-main.list"

              # Retry pkg update a few times
              for i in 1 2 3; do
                if pkg update -y; then
                  break
                fi
                echo "pkg update attempt $i failed, retrying in 10s..."
                sleep 10
                if [[ $i -eq 3 ]]; then
                  echo "pkg update failed after 3 attempts" >&2
                  exit 1
                fi
              done

              # Install repositories and all required dependencies
              pkg install x11-repo tur-repo -y
              pkg install -y \
                git clang lld binutils cmake autoconf automake libtool make python python-pip ninja llvm bison flex pkg-config \
                fontconfig freetype gnutls libgnutls libgmp \
                libandroid-shmem libandroid-shmem-static libandroid-spawn \
                libx11 xorgproto libdrm libpixman libjpeg-turbo xtrans libxxf86vm xorg-xrandr \
                xorg-font-util xorg-util-macros libxfont2 libxkbfile libpciaccess \
                xcb-util-renderutil xcb-util-image xcb-util-keysyms xcb-util-wm \
                xorg-xkbcomp xkeyboard-config libxdamage libxinerama libxshmfence \
                libxcb libxcomposite libxcursor libxfixes libxrender \
                glslang shaderc vulkan-headers vulkan-loader-generic vulkan-tools \
                libclc spirv-llvm-translator zlib zstd libexpat \
                libxrandr libxrandr-static mesa-demos osmesa glmark2 \
                pulseaudio termux-x11-nightly patch file

              # Install Python build dependencies (including setuptools to fix distutils)
              pip install --break-system-packages meson mako pyyaml packaging setuptools

              mkdir -p "$TMPDIR"
              cd "$TMPDIR"
              rm -rf mesa-panvk
              git clone --depth 1 https://github.com/xodiosx/mesa-panvk-g57.git mesa-panvk
              cd mesa-panvk

              # ── Apply sigbus.patch from repo root (mounted at /patch) ──
              if [[ -f /patch/sigbus.patch ]]; then
                echo "=============================================="
                echo "Applying /patch/sigbus.patch ..."
                echo "=============================================="
                if git apply --verbose /patch/sigbus.patch; then
                  echo ">>> git apply succeeded"
                else
                  echo ">>> git apply failed, falling back to patch(1)"
                  patch -p1 --batch --forward < /patch/sigbus.patch
                fi
                echo "--- patch applied, diff stat: ---"
                git --no-pager diff --stat || true
                echo "--- end of diff stat ---"
              else
                echo "WARNING: /patch/sigbus.patch not found, building unpatched"
                ls -la /patch || true
              fi

              # ── Install silence header (copied from host) ──
              echo "=============================================="
              echo "Installing silence header ..."
              echo "=============================================="

              if [[ ! -f /patch/panvk_silence.h ]]; then
                echo "ERROR: /patch/panvk_silence.h missing — host step did not run"
                ls -la /patch || true
                exit 1
              fi

              cp /patch/panvk_silence.h "$PWD/src/panvk_silence.h"
              SILENCE_H="$PWD/src/panvk_silence.h"
              echo "Installed at: $SILENCE_H"
              wc -l "$SILENCE_H"
              head -3 "$SILENCE_H"

              export CFLAGS="-include $SILENCE_H"
              export CXXFLAGS="-include $SILENCE_H"
              echo "CFLAGS=$CFLAGS"
              echo "CXXFLAGS=$CXXFLAGS"
              # ──────────────────────────────────────────────────────────

              # CRITICAL FIX: We are building the Gallium (OpenGL) driver.
              # PanVK (Vulkan) requires the Panthor kernel driver, which is NOT available on Termux/Android (kbase).
              meson setup build-bionic \
                -Dbuildtype="$BUILD_TYPE" \
                -Dvulkan-drivers=panfrost \
                -Dgallium-drivers=panfrost \
                -Dpanfrost-kmds=kbase \
                -Dplatforms=x11 \
                -Dbuild-tests=false \
                -Dlibunwind=disabled \
                -Dvalgrind=disabled \
                -Dperfetto=false \
                -Dprefix="$PREFIX" \
                -Dc_link_args=-landroid-shmem \
                -Dcpp_link_args=-landroid-shmem

              # FIXED TARGET: Build the unified Gallium DRI module instead of a non-existent Panfrost-only target
              ninja -C build-bionic -j$(nproc) \
                src/gallium/targets/dri/libgallium_dri.so

              mkdir -p /termux-out/lib

              # Copy the unified Gallium DRI module
              cp build-bionic/src/gallium/targets/dri/libgallium_dri.so \
                 /termux-out/lib/libgallium_dri.so

              # ── Verify the silence header worked ──
              echo "=============================================="
              echo "Verifying PANVKDBG strings are gone from .so ..."
              echo "=============================================="
              PANVKDBG_STRINGS=$(strings /termux-out/lib/libgallium_dri.so | grep -c "PANVKDBG" || true)
              echo "PANVKDBG string literals remaining: $PANVKDBG_STRINGS"
              if [[ "$PANVKDBG_STRINGS" -lt 20 ]]; then
                echo ">>> PASS: silence header worked (calls DCEd)"
              else
                echo ">>> WARNING: many PANVKDBG strings still present"
                strings /termux-out/lib/libgallium_dri.so | grep "PANVKDBG" | head -10 || true
              fi
              # ─────────────────────────────────────────────────────

              echo "=== /termux-out ==="
              find /termux-out -type f
              echo "=== sizes ==="
              ls -lh /termux-out/lib/
            '

      - name: Package tarball (${{ matrix.build-type }})
        run: |
          set -euo pipefail
          cd "termux-out-${{ matrix.build-type }}"
          TARBALL="panfrost-termux-aarch64-${{ matrix.build-type }}-${{ needs.prepare.outputs.stamp }}.tar.gz"
          tar -czvf "../${TARBALL}" .
          ls -lh "../${TARBALL}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: panfrost-termux-aarch64-${{ matrix.build-type }}-${{ needs.prepare.outputs.stamp }}
          path: |
            termux-out-${{ matrix.build-type }}/
            panfrost-termux-aarch64-${{ matrix.build-type }}-${{ needs.prepare.outputs.stamp }}.tar.gz
          if-no-files-found: error

  release:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List downloaded files
        run: find artifacts -type f

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: "${{ needs.prepare.outputs.tag }} — Panfrost Build ${{ needs.prepare.outputs.date }} ${{ needs.prepare.outputs.time }} UTC"
          body: |
            ## Panfrost (OpenGL) for Termux (aarch64, native build)

            Built natively inside Termux (`termux/termux-docker:aarch64`)
            on `ubuntu-24.04-arm` — same toolchain class as an on-device
            native Termux build (Termux Clang/LLD, target
            `aarch64-linux-android35`).

            **Build date (UTC):** `${{ needs.prepare.outputs.date }}`
            **Build time (UTC):** `${{ needs.prepare.outputs.time }}`
            **Commit:** `${{ github.sha }}`
            **Build types:** `${{ needs.prepare.outputs.types }}`

            ### Build customizations
            - `sigbus.patch` applied (SHM debug dump SIGBUS fix)
            - `PANVKDBG` debug fprintf calls silenced via a `-include`
              wrapper — the compiler folds the check at compile time and
              dead-code eliminates every PANVKDBG call site. Same runtime
              performance as a source-level strip, no risk to control flow.
            - **Note:** This builds the unified Gallium (OpenGL) DRI module (`libgallium_dri.so`). 
              PanVK (Vulkan) is not built because it requires the Panthor kernel 
              driver, which is incompatible with Android's `kbase` driver.

            ### Files
            - `panfrost-termux-aarch64-debugoptimized-*.tar.gz` — full install tree (debug)
            - `panfrost-termux-aarch64-release-*.tar.gz` — full install tree (release)
            - `libgallium_dri.so` — Unified OpenGL DRI driver containing Panfrost (from the last-built variant)

            ### Install (Termux)
            ```bash
            tar -xzf panfrost-termux-aarch64-release-*.tar.gz -C $PREFIX
            ```
          files: |
            artifacts/*.tar.gz
            artifacts/**/libgallium_dri.so
          overwrite_files: true
          generate_release_notes: true
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
