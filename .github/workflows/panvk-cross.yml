name: Build PanVK for cross (aarch64, cross-compile via Android NDK)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build type"
        type: choice
        required: true
        default: both
        options:
          - both
          - debugoptimized
          - release
      release_tag:
        description: "Tag to create (leave empty to auto-generate)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      date:  ${{ steps.ts.outputs.date }}
      time:  ${{ steps.ts.outputs.time }}
      stamp: ${{ steps.ts.outputs.stamp }}
      tag:   ${{ steps.ts.outputs.tag }}
      types: ${{ steps.ts.outputs.types }}
    steps:
      - name: Compute build timestamp and tag
        id: ts
        run: |
          DATE=$(date -u +'%Y-%m-%d')
          TIME=$(date -u +'%H%M%S')
          STAMP="${DATE}-${TIME}"
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "date=$DATE"           >> "$GITHUB_OUTPUT"
          echo "time=$TIME"           >> "$GITHUB_OUTPUT"
          echo "stamp=$STAMP"         >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
          elif [[ -n "${{ github.event.inputs.release_tag }}" ]]; then
            TAG="${{ github.event.inputs.release_tag }}"
          else
            TAG="build-${DATE}-${TIME}-${SHORT_SHA}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          CHOICE="${{ github.event.inputs.build_type }}"
          case "$CHOICE" in
            release)        TYPES='["release"]' ;;
            debugoptimized) TYPES='["debugoptimized"]' ;;
            *)              TYPES='["debugoptimized","release"]' ;;
          esac
          echo "types=$TYPES" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        build-type: ${{ fromJSON(needs.prepare.outputs.types) }}

    steps:
      - name: Checkout (for sigbus.patch)
        uses: actions/checkout@v4

      - name: Verify sigbus.patch exists at repo root
        run: |
          set -euo pipefail
          PATCH="${{ github.workspace }}/sigbus.patch"
          if [[ ! -f "$PATCH" ]]; then
            echo "ERROR: sigbus.patch not found at repo root ($PATCH)"
            ls -la "${{ github.workspace }}"
            exit 1
          fi
          echo "Found patch:"
          ls -lh "$PATCH"
          echo "--- first 30 lines ---"
          head -n 30 "$PATCH"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
              build-essential \
              llvm-dev \
              libclang-dev \
              libclc-dev \
              libelf-dev \
              spirv-tools \
              bison \
              flex \
              libdrm-dev \
              pkg-config \
              ninja-build \
              patch
          python -m pip install --upgrade pip
          pip install mako PyYAML meson ninja packaging

      - name: Clone mesa-panvk-g57 and apply sigbus.patch
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          rm -rf mesa-src
          git clone --depth 1 https://github.com/xodiosx/mesa-panvk-g57.git mesa-src
          cd mesa-src

          echo "=============================================="
          echo "Applying sigbus.patch from repo root"
          echo "=============================================="
          if git apply --verbose "$GITHUB_WORKSPACE/sigbus.patch"; then
            echo ">>> git apply succeeded"
          else
            echo ">>> git apply failed, falling back to patch(1)"
            patch -p1 --batch --forward < "$GITHUB_WORKSPACE/sigbus.patch"
          fi
          git --no-pager diff --stat || true

          # memfd_create: NDK API 30+ has it natively, drop the __TERMUX__ guard
          sed -i \
            's/#if defined(HAVE_MEMFD_CREATE) \&\& !defined __TERMUX__/#if defined(HAVE_MEMFD_CREATE)/' \
            src/util/anon_file.c || true

      - name: Build host tools (mesa_clc, vtn_bindgen2, panfrost_compile)
        working-directory: mesa-src
        run: |
          set -euo pipefail
          meson setup build-host \
              -Dplatforms=[] \
              -Dgallium-drivers=[] \
              -Dvulkan-drivers=[] \
              -Dtools=panfrost \
              -Dprecomp-compiler=enabled \
              -Dinstall-precomp-compiler=true \
              -Dllvm=enabled \
              -Dmesa-clc=enabled -Dinstall-mesa-clc=true

          ninja -C build-host \
            src/compiler/clc/mesa_clc \
            src/compiler/spirv/vtn_bindgen2 \
            src/panfrost/clc/panfrost_compile

          ln -sf "build-host/src/compiler/clc/mesa_clc"       "build-host/src/compiler/clc/mesa-clc"
          ln -sf "build-host/src/compiler/spirv/vtn_bindgen2" "build-host/src/compiler/spirv/vtn-bindgen2"

          echo "==== Host tools built ===="
          ls -lh build-host/src/compiler/clc/mesa_clc
          ls -lh build-host/src/compiler/spirv/vtn_bindgen2
          ls -lh build-host/src/panfrost/clc/panfrost_compile

      - name: Generate Android cross file
        working-directory: mesa-src
        run: |
          set -euo pipefail

          # Resolve NDK path. GitHub's ubuntu-latest image ships the NDK and
          # exports ANDROID_NDK_LATEST_HOME. Fall back to scanning the sdk dir.
          if [[ -n "${ANDROID_NDK_LATEST_HOME:-}" && -d "$ANDROID_NDK_LATEST_HOME" ]]; then
            NDK="$ANDROID_NDK_LATEST_HOME"
          else
            NDK="/usr/local/lib/android/sdk/ndk/$(ls /usr/local/lib/android/sdk/ndk 2>/dev/null | sort -V | tail -1)"
          fi
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64"

          if [[ ! -d "$TOOLCHAIN" ]]; then
            echo "ERROR: NDK toolchain not found at $TOOLCHAIN"
            echo "ANDROID_NDK_LATEST_HOME=${ANDROID_NDK_LATEST_HOME:-<unset>}"
            ls -la /usr/local/lib/android/sdk/ndk 2>/dev/null || true
            exit 1
          fi

          API=30   # Android 11 — minimum for aarch64 memfd_create + Vulkan 1.1+
          cat > android-cross.txt <<EOF
          [binaries]
          c         = '$TOOLCHAIN/bin/aarch64-linux-android${API}-clang'
          cpp       = '$TOOLCHAIN/bin/aarch64-linux-android${API}-clang++'
          ar        = '$TOOLCHAIN/bin/llvm-ar'
          strip     = '$TOOLCHAIN/bin/llvm-strip'
          ld        = '$TOOLCHAIN/bin/ld.lld'
          pkgconfig = 'pkg-config'

          [host_machine]
          system     = 'android'
          cpu_family = 'aarch64'
          cpu        = 'aarch64'
          endian     = 'little'

          [properties]
          needs_exe_wrapper = true
          EOF

          echo "==== android-cross.txt ===="
          cat android-cross.txt

      - name: Configure meson (cross-compile, Winlator target)
        working-directory: mesa-src
        run: |
          set -euo pipefail
          HOST_TOOLS_CLC="$GITHUB_WORKSPACE/mesa-src/build-host/src/compiler/clc"
          HOST_TOOLS_SPIRV="$GITHUB_WORKSPACE/mesa-src/build-host/src/compiler/spirv"
          HOST_TOOLS_PANFROST="$GITHUB_WORKSPACE/mesa-src/build-host/src/panfrost/clc"
          export PATH="$HOST_TOOLS_CLC:$HOST_TOOLS_SPIRV:$HOST_TOOLS_PANFROST:$PATH"

          meson setup build --reconfigure \
              --cross-file android-cross.txt \
              -Dbuildtype=${{ matrix.build-type }} \
              -Dplatforms=android,x11 \
              -Dandroid-stub=true \
              -Dandroid-libbacktrace=disabled \
              -Dplatform-sdk-version=30 \
              -Dglx=disabled \
              -Dgbm=disabled \
              -Degl=disabled \
              -Dopengl=false \
              -Dgles1=disabled \
              -Dgles2=disabled \
              -Dglvnd=disabled \
              -Dvalgrind=disabled \
              -Dgallium-drivers= \
              -Dshared-glapi=disabled \
              -Dzstd=disabled \
              -Dmesa-clc=system \
              -Dprecomp-compiler=system \
              -Dvulkan-drivers=panfrost \
              -Dllvm=disabled \
              -Dpanfrost-kmds=kbase,panthor

      - name: Compile libvulkan_panfrost.so
        working-directory: mesa-src
        run: |
          set -euo pipefail
          HOST_TOOLS_CLC="$GITHUB_WORKSPACE/mesa-src/build-host/src/compiler/clc"
          HOST_TOOLS_SPIRV="$GITHUB_WORKSPACE/mesa-src/build-host/src/compiler/spirv"
          HOST_TOOLS_PANFROST="$GITHUB_WORKSPACE/mesa-src/build-host/src/panfrost/clc"
          export PATH="$HOST_TOOLS_CLC:$HOST_TOOLS_SPIRV:$HOST_TOOLS_PANFROST:$PATH"

          ninja -C build src/panfrost/vulkan/libvulkan_panfrost.so

      - name: Package tarball (${{ matrix.build-type }})
        run: |
          set -euo pipefail
          OUT="winlator-out-${{ matrix.build-type }}"
          mkdir -p "$OUT/lib" "$OUT/share/vulkan/icd.d"

          cp mesa-src/build/src/panfrost/vulkan/libvulkan_panfrost.so "$OUT/lib/"

          # ICD manifest for Winlator. Uses a bare library name so it resolves
          # via LD_LIBRARY_PATH inside the container.
          cat > "$OUT/share/vulkan/icd.d/panfrost_icd.aarch64.json" <<'JSON'
          {
              "file_format_version": "1.0.1",
              "ICD": {
                  "library_path": "libvulkan_panfrost.so",
                  "api_version": "1.4.354",
                  "library_arch": "64"
              }
          }
          JSON

          echo "==== ICD ===="
          cat "$OUT/share/vulkan/icd.d/panfrost_icd.aarch64.json"
          echo "==== output tree ===="
          find "$OUT" -type f

          TARBALL="panvk-winlator-aarch64-${{ matrix.build-type }}-${{ needs.prepare.outputs.stamp }}.tar.gz"
          tar -czvf "$TARBALL" -C "$OUT" .
          ls -lh "$TARBALL"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: panvk-winlator-aarch64-${{ matrix.build-type }}-${{ needs.prepare.outputs.stamp }}
          path: |
            winlator-out-${{ matrix.build-type }}/
            panvk-winlator-aarch64-${{ matrix.build-type }}-${{ needs.prepare.outputs.stamp }}.tar.gz
          if-no-files-found: error

  release:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List downloaded files
        run: find artifacts -type f

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: "${{ needs.prepare.outputs.tag }} — PanVK Winlator build ${{ needs.prepare.outputs.date }} ${{ needs.prepare.outputs.time }} UTC"
          body: |
            ## PanVK for Winlator (aarch64, cross-compile via Android NDK)

            Cross-compiled on `ubuntu-latest` (x86_64) using the Android NDK
            toolchain (`aarch64-linux-android30-clang`), targeting the
            Android ABI used by Winlator and similar Android Linux containers.

            **Build date (UTC):** `${{ needs.prepare.outputs.date }}`
            **Build time (UTC):** `${{ needs.prepare.outputs.time }}`
            **Commit:** `${{ github.sha }}`
            **Build types:** `${{ needs.prepare.outputs.types }}`

            ### Files
            - `panvk-winlator-aarch64-debugoptimized-*.tar.gz`
            - `panvk-winlator-aarch64-release-*.tar.gz`
            - `libvulkan_panfrost.so` — Vulkan driver
            - `panfrost_icd.aarch64.json` — ICD manifest

            ### Install (Winlator / Android container)
            ```bash
            tar -xzf panvk-winlator-aarch64-release-*.tar.gz -C /path/to/rootfs
            export VK_ICD_FILENAMES=/path/to/rootfs/share/vulkan/icd.d/panfrost_icd.aarch64.json
            export LD_LIBRARY_PATH=/path/to/rootfs/lib:$LD_LIBRARY_PATH
            ```
          files: |
            artifacts/*.tar.gz
            artifacts/**/libvulkan_panfrost.so
            artifacts/**/panfrost_icd.aarch64.json
          overwrite_files: true
          generate_release_notes: true
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
