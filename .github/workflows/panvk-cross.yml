name: Cross PANVK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Install host build tools
        run: |
          sudo apt update
          sudo apt install -y ninja-build pkg-config python3-mako python3-pip \
            glslang-tools flex bison curl ca-certificates patch unzip wget \
            qemu-user-static file
          pip install --user meson mako pyyaml packaging ply
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          command -v qemu-aarch64-static

      - name: Download Android NDK
        run: |
          NDK_VERSION="r29"
          wget -q "https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip"
          unzip -q "android-ndk-${NDK_VERSION}-linux.zip" -d /opt
          echo "ANDROID_NDK_HOME=/opt/android-ndk-${NDK_VERSION}" >> $GITHUB_ENV

      - name: Setup Termux sysroot
        run: |
          set -euo pipefail
          mkdir -p termux && cd termux
          wget -q https://github.com/xodiosx/Wine-arm64ce/releases/download/wine-14/termux-rootfs.tar
          tar xf termux-rootfs.tar
          sudo mv data /data
          sudo chown -R $(whoami):$(whoami) /data
          sudo chmod -R a+rX /data/data/com.termux/files/usr
          mkdir -p /data/data/com.termux/files/usr/tmp

      - name: Install PanVK runtime deps into Termux sysroot
        run: |
          set -euo pipefail
          cd /tmp
          rm -rf panvk-debs && mkdir panvk-debs && cd panvk-debs
          BASE="https://packages.termux.dev/apt/termux-main"
          for pkg in libdrm libandroid-shmem libclc spirv-tools \
                     spirv-llvm-translator libxcb xorgproto libx11 libxshmfence \
                     zlib zstd libexpat; do
            wget -q -r -l1 -np -nH --cut-dirs=0 \
              --accept-regex "${pkg}_.*_aarch64\.deb|${pkg}_.*_all\.deb" \
              "${BASE}/pool/main/${pkg:0:1}/${pkg}/" -P . || true
          done
          find . -name '*.deb' -print -exec dpkg-deb -x {} /tmp/panvk-debs/rootfs/ \;
          sudo cp -rn /tmp/panvk-debs/rootfs/data/data/com.termux/files/usr/. \
                       /data/data/com.termux/files/usr/ || true
          sudo chmod -R a+rX /data/data/com.termux/files/usr/lib

      - name: Provide libatomic to NDK sysroot
        run: |
          set -euo pipefail
          NDK_SYSROOT_LIB="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android"
          SRC=$(find "$ANDROID_NDK_HOME" -name 'libclang_rt.builtins-aarch64-android.a' -print -quit)
          [ -n "$SRC" ] || { echo "no builtins archive found"; exit 1; }
          sudo cp "$SRC" "$NDK_SYSROOT_LIB/libatomic.a"
          sudo chmod 644 "$NDK_SYSROOT_LIB/libatomic.a"

      - name: Setup pkg-config wrapper
        run: |
          sudo tee /usr/local/bin/termux-pkg-config > /dev/null << 'SCRIPT'
          #!/bin/bash
          export PKG_CONFIG_LIBDIR=/data/data/com.termux/files/usr/lib/pkgconfig:/data/data/com.termux/files/usr/share/pkgconfig
          export PKG_CONFIG_SYSROOT_DIR=/data/data/com.termux/files/usr
          exec /usr/bin/pkg-config "$@"
          SCRIPT
          sudo chmod +x /usr/local/bin/termux-pkg-config

      - name: Create cross compiler wrappers
        run: |
          NDK_BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          sudo tee /usr/local/bin/android-cross-cc > /dev/null << EOF
          #!/bin/bash
          # Meson sanity check produces a dynamic Bionic ELF that qemu-user-static
          # cannot load (no /system/bin/linker64 on the host). Force -static for
          # invocations that look like the sanity check.
          for arg in "\$@"; do
            case "\$arg" in
              *sanitycheck*)
                exec "${NDK_BIN}/aarch64-linux-android29-clang" -static "\$@"
                ;;
            esac
          done
          exec "${NDK_BIN}/aarch64-linux-android29-clang" "\$@"
          EOF
          sudo tee /usr/local/bin/android-cross-cxx > /dev/null << EOF
          #!/bin/bash
          for arg in "\$@"; do
            case "\$arg" in
              *sanitycheck*)
                exec "${NDK_BIN}/aarch64-linux-android29-clang++" -static "\$@"
                ;;
            esac
          done
          exec "${NDK_BIN}/aarch64-linux-android29-clang++" "\$@"
          EOF
          sudo chmod 755 /usr/local/bin/android-cross-cc /usr/local/bin/android-cross-cxx
          printf 'int main(void){return 0;}\n' > /tmp/sc.c
          /usr/local/bin/android-cross-cc /tmp/sc.c -o /tmp/sc
          file /tmp/sc
          qemu-aarch64-static /tmp/sc && echo "static sanity binary runs OK"

      - name: Clone Mesa PanVK fork
        run: git clone --depth 1 https://github.com/xodiosx/mesa-panvk-g57.git ~/mesa-panvk

      - name: Strip libudev from Mesa
        run: |
          cd ~/mesa-panvk
          # Replace the whole dependency('libudev', ...) call with a clean one,
          # so no duplicate required:/version: keywords survive.
          sed -i -E "s/dependency\('libudev'[^)]*\)/dependency('libudev', required : false, disabler : true)/g" meson.build
          sed -i "s/has_header('libudev.h')/false/g" meson.build
          echo "=== libudev references ==="
          grep -n "libudev" meson.build || true

      # ------------------------------------------------------------------
      # Fix #1 — vtn_bindgen2 (src/compiler/spirv/meson.build)
      # ------------------------------------------------------------------
      - name: Fix vtn_bindgen2 for cross build
        run: |
          cd ~/mesa-panvk
          sed -i \
            -e "s|\['vtn_bindgen2.c'\],|['vtn_bindgen2.c', vtn_generator_ids_h, spirv_info_h],|" \
            -e "s|dependencies : \[idep_vtn, idep_mesautil, idep_nir\],|dependencies : [],|" \
            src/compiler/spirv/meson.build
          echo "=== vtn_bindgen2 block ==="
          sed -n '/prog_vtn_bindgen2 = executable/,/^   )/p' src/compiler/spirv/meson.build

      # ------------------------------------------------------------------
      # Fix #2 — remove with_panfrost_vk from with_driver_using_cl
      # ------------------------------------------------------------------
      - name: Drop PanVK from CLC drivers list
        run: |
          cd ~/mesa-panvk
          sed -i \
            "s|with_gallium_panfrost, with_panfrost_vk,|with_gallium_panfrost,|" \
            meson.build
          echo "=== with_driver_using_cl ==="
          sed -n '/with_driver_using_cl = \[/,/\].contains(true)/p' meson.build

      # ------------------------------------------------------------------
      # Fix #3 — guard src/poly subdirs when CLC is off
      # ------------------------------------------------------------------
      - name: Guard src/poly CLC subdir when CLC is off
        run: |
          cd ~/mesa-panvk
          echo "=== src/poly/meson.build BEFORE ==="
          cat src/poly/meson.build
          sed -i "s|^subdir('clc')|if with_clc\n  subdir('clc')\nendif|" src/poly/meson.build
          sed -i "s|^subdir('cl')|if with_clc\n  subdir('cl')\nendif|"  src/poly/meson.build
          echo "=== src/poly/meson.build AFTER ==="
          cat src/poly/meson.build
          if grep -q "^if with_clc" src/poly/meson.build; then
            echo "OK: subdir guarded"
          else
            echo "WARN: no subdir('cl'/'clc') found — the file may have moved"
          fi

      - name: Create Meson cross file
        run: |
          cat > ~/cross_file.txt <<EOF
          [binaries]
          c       = '/usr/local/bin/android-cross-cc'
          cpp     = '/usr/local/bin/android-cross-cxx'
          ar      = '$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar'
          strip   = '$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip'
          pkg-config = 'termux-pkg-config'
          exe_wrapper = 'qemu-aarch64-static'

          [properties]
          needs_exe_wrapper = true

          [host_machine]
          system     = 'linux'
          cpu_family = 'aarch64'
          cpu        = 'aarch64'
          endian     = 'little'

          [built-in options]
          c_args     = ['-I/data/data/com.termux/files/usr/include']
          cpp_args   = ['-I/data/data/com.termux/files/usr/include']
          c_link_args   = ['-L/data/data/com.termux/files/usr/lib']
          cpp_link_args = ['-L/data/data/com.termux/files/usr/lib']
          EOF
          cat ~/cross_file.txt

      - name: Configure Mesa for PanVK cross build
        run: |
          meson setup build ~/mesa-panvk \
            --cross-file ~/cross_file.txt \
            -Dbuildtype=debugoptimized \
            -Dvulkan-drivers=panfrost \
            -Dgallium-drivers= \
            -Dpanfrost-kmds=kbase,panthor \
            -Dpanvk-use-kbase=true \
            -Dplatforms=x11 \
            -Dglx=disabled \
            -Degl=disabled \
            -Dopengl=false \
            -Dgles1=disabled \
            -Dgles2=disabled \
            -Dbuild-tests=false \
            -Dlibunwind=disabled \
            -Dvalgrind=disabled \
            -Dperfetto=false \
            -Dprefix=/data/data/com.termux/files/usr \
            -Dc_link_args="-L/data/data/com.termux/files/usr/lib -landroid-shmem" \
            -Dcpp_link_args="-L/data/data/com.termux/files/usr/lib -landroid-shmem"

      - name: Build PanVK shared library
        run: ninja -C build -j$(nproc) src/panfrost/vulkan/libvulkan_panfrost.so

      - name: Package artifacts
        run: |
          mkdir -p panvk_out/lib panvk_out/share/vulkan/icd.d
          find build -name "libvulkan_panfrost*.so" -exec cp {} panvk_out/lib/ \;
          find build -name "panfrost_icd*.json"   -exec cp {} panvk_out/share/vulkan/icd.d/ \; || true
          tar -cJf panvk-aarch64.tar.xz -C panvk_out .
          ls -lh panvk-aarch64.tar.xz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: panvk-aarch64
          path: panvk-aarch64.tar.xz

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: panvk-aarch64.tar.xz
          generate_release_notes: true
          prerelease: true
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
