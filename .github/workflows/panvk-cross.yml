name: Cross PANVK (host tools + shims)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150

    strategy:
      fail-fast: false
      matrix:
        build-type: [debugoptimized, release]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install host build tools
        run: |
          sudo apt update
          sudo apt install -y ninja-build pkg-config python3-mako python3-pip \
            glslang-tools flex bison curl ca-certificates patch unzip wget \
            file build-essential \
            llvm-20-dev libclang-20-dev libclc-20-dev libllvmspirvlib-20-dev \
            libelf-dev spirv-tools libdrm-dev
          pip install --user meson mako pyyaml packaging ply
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Download Android NDK
        run: |
          NDK_VERSION="r29"
          wget -q "https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip"
          unzip -q "android-ndk-${NDK_VERSION}-linux.zip" -d /opt
          echo "ANDROID_NDK_HOME=/opt/android-ndk-${NDK_VERSION}" >> $GITHUB_ENV

      - name: Setup Termux sysroot
        run: |
          set -euo pipefail
          mkdir -p termux && cd termux
          wget -q https://github.com/xodiosx/Wine-arm64ce/releases/download/wine-14/termux-rootfs.tar
          tar xf termux-rootfs.tar
          sudo mv data /data
          sudo chown -R $(whoami):$(whoami) /data
          sudo chmod -R a+rX /data/data/com.termux/files/usr
          mkdir -p /data/data/com.termux/files/usr/tmp

      - name: Install PanVK runtime deps into Termux sysroot
        run: |
          set -euo pipefail
          cd /tmp
          rm -rf panvk-debs && mkdir panvk-debs && cd panvk-debs
          BASE="https://packages.termux.dev/apt/termux-main"
          for pkg in libdrm libandroid-shmem libclc spirv-tools \
                     spirv-llvm-translator libxcb xorgproto libx11 libxshmfence \
                     libxrandr libxext libxfixes libxxf86vm \
                     zlib zstd libexpat; do
            wget -q -r -l1 -np -nH --cut-dirs=0 \
              --accept-regex "${pkg}_.*_aarch64\.deb|${pkg}_.*_all\.deb" \
              "${BASE}/pool/main/${pkg:0:1}/${pkg}/" -P . || true
          done
          find . -name '*.deb' -print -exec dpkg-deb -x {} /tmp/panvk-debs/rootfs/ \;
          sudo cp -rn /tmp/panvk-debs/rootfs/data/data/com.termux/files/usr/. \
                       /data/data/com.termux/files/usr/ || true
          sudo chmod -R a+rX /data/data/com.termux/files/usr/lib

      - name: Provide libatomic to NDK sysroot
        run: |
          set -euo pipefail
          NDK_SYSROOT_LIB="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android"
          SRC=$(find "$ANDROID_NDK_HOME" -name 'libclang_rt.builtins-aarch64-android.a' -print -quit)
          [ -n "$SRC" ] || { echo "no builtins archive found"; exit 1; }
          sudo cp "$SRC" "$NDK_SYSROOT_LIB/libatomic.a"
          sudo chmod 644 "$NDK_SYSROOT_LIB/libatomic.a"

      - name: Clone Mesa PanVK fork
        run: git clone --depth 1 https://github.com/xodiosx/mesa-panvk-g57.git ~/mesa-panvk

      - name: Strip libudev from Mesa
        run: |
          cd ~/mesa-panvk
          sed -i -E "s/dependency\('libudev'[^)]*\)/dependency('libudev', required : false, disabler : true)/g" meson.build
          sed -i "s/has_header('libudev.h')/false/g" meson.build
          echo "=== libudev references ==="
          grep -n "libudev" meson.build || true

      # ------------------------------------------------------------------
      # STEP 1 — Build host tools natively on the x86_64 runner.
      # ------------------------------------------------------------------
      - name: Build host tools
        run: |
          cd ~/mesa-panvk
          meson setup build-host \
            -Dplatforms=[] \
            -Dgallium-drivers=[] \
            -Dvulkan-drivers=[] \
            -Dtools=panfrost \
            -Dprecomp-compiler=enabled \
            -Dinstall-precomp-compiler=true \
            -Dllvm=enabled \
            -Dmesa-clc=enabled \
            -Dinstall-mesa-clc=true

          ninja -C build-host \
            src/compiler/clc/mesa_clc \
            src/compiler/spirv/vtn_bindgen2 \
            src/panfrost/clc/panfrost_compile

          ln -sf "$PWD/build-host/src/compiler/clc/mesa_clc"         "$PWD/build-host/src/compiler/clc/mesa-clc"
          ln -sf "$PWD/build-host/src/compiler/spirv/vtn_bindgen2"   "$PWD/build-host/src/compiler/spirv/vtn-bindgen2"
          ln -sf "$PWD/build-host/src/panfrost/clc/panfrost_compile" "$PWD/build-host/src/panfrost/clc/panfrost-compile"

          echo "$PWD/build-host/src/compiler/clc"   >> $GITHUB_PATH
          echo "$PWD/build-host/src/compiler/spirv" >> $GITHUB_PATH
          echo "$PWD/build-host/src/panfrost/clc"   >> $GITHUB_PATH

      - name: Verify host tools on PATH
        run: |
          ls -la ~/mesa-panvk/build-host/src/compiler/clc/mesa-clc
          ls -la ~/mesa-panvk/build-host/src/compiler/spirv/vtn-bindgen2
          ls -la ~/mesa-panvk/build-host/src/panfrost/clc/panfrost-compile
          command -v mesa-clc
          command -v vtn-bindgen2

      # ------------------------------------------------------------------
      # STEP 2 — Create pkg-config shims.
      # ------------------------------------------------------------------
      - name: Create pkg-config shims
        run: |
          cd ~/mesa-panvk
          mkdir -p shims

          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar" \
            cr shims/librt.a

          cat > shims/xrandr.pc << 'EOF'
          Name: xrandr
          Description: xrandr
          Version: 1.15
          Libs: -lXrandr
          Cflags:
          EOF

          cat > shims/libdrm.pc << 'EOF'
          Name: libdrm
          Description: libdrm
          Version: 2.5
          Libs: -ldrm
          Cflags:
          EOF

          cat > shims/libx11-xcb.pc << 'EOF'
          Name: libx11-xcb
          Description: libx11-xcb
          Version: 2.5
          Libs: -lX11-xcb
          Cflags:
          EOF

          cat > shims/android.hardware.graphics.mapper.pc << 'EOF'
          Name: android.hardware.graphics.mapper
          Description: android.hardware.graphics.mapper
          Version: 4.0
          Libs: -landroid.hardware.graphics.mapper
          Cflags:
          EOF

          for lib in xcb xcb-randr xcb-dri3 xcb-present xcb-shm xcb-sync \
                     xshmfence xcb-xfixes gralloctypes hidlbase utils cutils \
                     hardware log sync nativewindow ui; do
            cat > shims/$lib.pc << EOF
          Name: $lib
          Description: $lib
          Version: 1.15
          Libs: -l$lib
          Cflags:
          EOF
          done

          ls -1 shims/

      - name: Verify shims work
        run: |
          echo "--- pkg-config sees: ---"
          PKG_CONFIG_LIBDIR=$HOME/mesa-panvk/shims /usr/bin/pkg-config --libs --cflags libdrm
          PKG_CONFIG_LIBDIR=$HOME/mesa-panvk/shims /usr/bin/pkg-config --libs --cflags xcb
          PKG_CONFIG_LIBDIR=$HOME/mesa-panvk/shims /usr/bin/pkg-config --libs --cflags xrandr

      # ------------------------------------------------------------------
      # STEP 3 — Create the Meson cross file template.
      #
      # Includes pkg-config = '/usr/bin/pkg-config'. The shim directory
      # is injected via PKG_CONFIG_LIBDIR on the configure step, so
      # pkg-config only ever sees our shims.
      # ------------------------------------------------------------------
      - name: Create android.toml
        run: |
          cat > ~/mesa-panvk/android.toml << 'EOF'
          [binaries]
          c          = '$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android30-clang'
          cpp        = '$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android30-clang++'
          ar         = '$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar'
          strip      = '$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip'
          pkg-config = '/usr/bin/pkg-config'

          [host_machine]
          system     = 'android'
          cpu_family = 'aarch64'
          cpu        = 'aarch64'
          endian     = 'little'

          [properties]
          needs_exe_wrapper = true

          [built-in options]
          c_args     = ['-I$MESON_WORKING_DIR/shims', '-I/data/data/com.termux/files/usr/include']
          cpp_args   = ['-I$MESON_WORKING_DIR/shims', '-I/data/data/com.termux/files/usr/include']
          c_link_args   = ['-L/data/data/com.termux/files/usr/lib', '-L$MESON_WORKING_DIR/shims']
          cpp_link_args = ['-L/data/data/com.termux/files/usr/lib', '-L$MESON_WORKING_DIR/shims']
          EOF
          cat ~/mesa-panvk/android.toml

      - name: Generate cross file with envsubst
        run: |
          export MESON_WORKING_DIR="$HOME/mesa-panvk"
          export ANDROID_NDK_HOME="$ANDROID_NDK_HOME"
          envsubst < ~/mesa-panvk/android.toml > /tmp/android_wrapper.toml
          cat /tmp/android_wrapper.toml

      # ------------------------------------------------------------------
      # STEP 4 — Minimal patches.
      # ------------------------------------------------------------------
      - name: Apply minimal patches
        run: |
          cd ~/mesa-panvk

          sed -i \
            "s|with_gallium_panfrost, with_panfrost_vk,|with_gallium_panfrost,|" \
            meson.build

          sed -i "1i if not is_variable('idep_libpoly')\n  idep_libpoly = declare_dependency()\nendif\n" \
            src/poly/nir/meson.build

          echo "=== with_driver_using_cl ==="
          grep -n "with_driver_using_cl" meson.build || true
          echo "=== src/poly/nir/meson.build head ==="
          head -5 src/poly/nir/meson.build

      # ------------------------------------------------------------------
      # STEP 5 — Cross configure and build.
      # ------------------------------------------------------------------
      - name: Configure cross build
        env:
          PKG_CONFIG_LIBDIR: /home/runner/mesa-panvk/shims
        run: |
          cd ~/mesa-panvk
          meson setup build --reconfigure \
            --cross-file /tmp/android_wrapper.toml \
            -Dbuildtype=${{ matrix.build-type }} \
            -Dplatforms=android,x11 \
            -Dandroid-stub=true \
            -Dandroid-libbacktrace=disabled \
            -Dplatform-sdk-version=30 \
            -Dglx=disabled \
            -Dgbm=disabled \
            -Degl=disabled \
            -Dopengl=false \
            -Dgles1=disabled \
            -Dgles2=disabled \
            -Dglvnd=disabled \
            -Dvalgrind=disabled \
            -Dgallium-drivers= \
            -Dshared-glapi=disabled \
            -Dzstd=disabled \
            -Dmesa-clc=system \
            -Dprecomp-compiler=system \
            -Dvulkan-drivers=panfrost \
            -Dllvm=disabled \
            -Dstrip=false \
            -Dpanfrost-kmds=kbase,panthor \
            -Dpanvk-use-kbase=true \
            -Dlibunwind=disabled \
            -Dperfetto=false \
            -Dc_link_args="-L/data/data/com.termux/files/usr/lib -landroid-shmem" \
            -Dcpp_link_args="-L/data/data/com.termux/files/usr/lib -landroid-shmem"

      - name: Build PanVK shared library
        run: |
          cd ~/mesa-panvk
          ninja -C build -j$(nproc) src/panfrost/vulkan/libvulkan_panfrost.so

      - name: Dump meson log on failure
        if: failure()
        run: |
          tail -300 ~/mesa-panvk/build/meson-logs/meson-log.txt 2>/dev/null || true

      - name: Package artifacts
        run: |
          mkdir -p panvk_out/lib panvk_out/share/vulkan/icd.d
          find ~/mesa-panvk/build -name "libvulkan_panfrost*.so" -exec cp {} panvk_out/lib/ \;
          find ~/mesa-panvk/build -name "panfrost_icd*.json"   -exec cp {} panvk_out/share/vulkan/icd.d/ \; || true
          tar -cJf panvk-aarch64-${{ matrix.build-type }}.tar.xz -C panvk_out .
          ls -lh panvk-aarch64-*.tar.xz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: panvk-aarch64-${{ matrix.build-type }}
          path: panvk-aarch64-${{ matrix.build-type }}.tar.xz

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: panvk-aarch64-${{ matrix.build-type }}.tar.xz
          generate_release_notes: true
          prerelease: true
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
